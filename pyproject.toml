# Only build settings live here. All distribution metadata is in `[project]`,
# which the build backend reads in preference to this table. Listing a field in
# both means the `[project]` copy wins silently, so there is one copy of each.
[tool.poetry]
packages = [
    { include = "conftee" },
]

[tool.pytest.ini_options]
# The package is not installed into the environment during development, so the
# repository root has to be on sys.path for `import conftee` to resolve. Running
# `python -m pytest` happens to add it and a bare `pytest` does not, which makes
# the suite work or fail depending on how it was invoked. Setting it here makes
# both work.
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dev-dependencies]
poetry = "^1.0.0"
pytest = "^8.0"

[project]
name = "conftee"
version = "0.2.1"
description = "Check that a config file conforms to a template with typed, named holes."
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "eerieA", email = "3959788+eerieA@users.noreply.github.com"},
]
maintainers = [
  {name = "eerieA", email = "3959788+eerieA@users.noreply.github.com"}
]
keywords = ["config", "configuration", "template", "compliance", "validation", "schema", "diff", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "colored >= 1.4.4",
    # Schema files are hand-edited, so the format needs comments
    "PyYAML >= 6.0.1",
    # Imported by differ_o, section_comparer, gen_summary and config_compare, so
    # it is required by the current code. See requirements.txt for why it is a
    # lower bound rather than an exact pin, and why the dependency is
    # replaceable in principle.
    "pandas >= 2.2",
]

[project.urls]
Repository = "https://github.com/eerieA/conf-tee"
Issues = "https://github.com/eerieA/conf-tee/issues"

