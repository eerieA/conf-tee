[tool.poetry]
name = "conftee"
version = "0.1.5"
description = "Check that a config file conforms to a template with typed, named holes."
authors = ["eerieA <ninja.duan@gmail.com>"]
packages = [
    { include = "conftee" },
]
readme = "README.md"
license = "MIT"

# When using pip to install, this dependency list will be read
[tool.poetry.dependencies]
colored="1.4.4"
Mako="1.3.3"
Jinja2="3.1.2"
# Dependencies for pandas, but this project theoretically does not stricly need pandas
MarkupSafe="2.1.3"
numpy="1.26.3"
pandas="2.1.4"
python-dateutil="2.8.2"
pytz="2023.3.post1"
six="1.16.0"
tzdata="2023.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dev-dependencies]
poetry = "^1.0.0"

# This section will not be read since currently built through poetry
# But keeping it in case we don't use poetry in the future
[project]
name = "conftee"
version = "0.1.5"
dependencies = [
    "python >= 3.9",
]
requires-python = ">=3.9"
authors = [
  {name = "eerieA", email = "ninja.duan@gmail.com"},
]
maintainers = [
  {name = "eerieA", email = "ninja.duan@gmail.com"}
]
description = "Check that a config file conforms to a template with typed, named holes."
readme = "README.md"
license = {file = "LICENSE"}

