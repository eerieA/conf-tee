# Conformance schema for the Cisco campus configs this tool was built against.
#
# Transcribed from the engine's former hardcoded constants, and pinned by the
# regression corpus in tests/test_regression.py. It doubles as the worked
# example of the format, so it is commented more heavily than a schema needs
# to be.

# How the template dialect is written: variable delimiters, and the markers
# that open a device or section block.
syntax:
  # {Variable}
  variable: '\{[\-\#\w]+\}'
  # {{Variable}+1}
  expression: '\{\{[\-\#\w]+\}[-+][0-9]\}'
  # The operator and operand tail of an expression. Operands run 0 to 99.
  operation: '\}[+-]([1-9][0-9]?|[0-9])'
  blocks:
    # ~~~~~~~ site01-hub1 ~~~~~
    device:
      title_line: '^\s*~+\s*([a-zA-Z0-9\-\_\#]+\s*)+\s*~*$'
      title: '[a-zA-Z\_\#][\-\w\s]+\s*'
    # ! ########### VRF START ###########
    section:
      title_line: '^\s*!\s*#+\s([A-Z]+\s*)+START\s[0-9a-zA-Z#\s]*$'
      title: '([A-Z]+\s*)+START'
      title_suffix: 'START'

# Value kinds. `arithmetic` is what makes {{Var}+1} evaluable; a type without
# it cannot appear in an expression at all.
types:
  any_token:
    regex: '[^\s]+'
  fw_context_name:
    regex: '([A-Z]{4}\d{2})|(TEST_CONTEXT_\d+)'
  ibvpn_metric:
    regex: '(2[0-4][0-9]|25[0-4]|[2-9]|[1-9][0-9])'
  int_name:
    regex: '(GigabitEthernet|TenGigabitEthernet|FortyGigabitEthernet)'
  int_num:
    regex: '((([1-9][0-9])|[0-9])(\/(([1-9][0-9])|[0-9])){1,2})|([1-9][0-9]{0,1})'
  ip_local_pool_name:
    regex: '[A-Z0-9]+(?:\.[A-Z0-9]+)*'
  ipv4:
    regex: '([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])'
    arithmetic: ipv4
  ipv4_host:
    regex: '([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])'
    arithmetic: ipv4
  mdt_address:
    regex: '239\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])'
    arithmetic: ipv4
  net_type_4_vlan_name:
    regex: '[A-Z]{4}\d{2}-[\w-]+=(DNET-USER|RESN-USER)'
  net_type_4_vrf_name:
    regex: '(DNET-USER|RESN-USER)'
  net_type_5_vlan_name:
    regex: '[A-Z]{4}\d{2}-[\w-]+'
  net_type_6_vlan_name:
    regex: '[^\d\-=._][\w\-=._]*'
  # A fixed literal, not a computed address: no expression ever does arithmetic
  # on it, so it declares no arithmetic engine.
  netmask_29:
    regex: '255.255.255.248'
  ospf_area_num:
    regex: '(?:\d|[1-9]\d{1,2})'
    arithmetic: int
  rd_id:
    regex: '[1-9]\d{0,3}$'
    arithmetic: int
  test_int_num:
    regex: '(\w+\_)+\d+'
  vlan_id:
    regex: '[1-9]\d{0,3}'
    arithmetic: int
  vlan_name:
    regex: '[A-Z]{4}\d{2}-[\w-]+=[A-Z]{4}-[^_\s]+$'
  vrf_name:
    regex: '[A-Z]{4}-[^\s]+'
  # A fixed literal; see netmask_29 above.
  wildcard_29:
    regex: '0.0.0.7'

# The vocabulary. `scope` is where a value must stay consistent; `file` is the
# default and is omitted below. `role` carries meaning no regex can express.
variables:
  Vlan_ID_fwglue: vlan_id
  Vlan_ID_vrfglue: vlan_id
  Vlan_ID_vpnglue: vlan_id
  Vlan_ID_user:
    type: vlan_id
    pool: user_vlan
  Vlan_name: vlan_name
  net_type_5_Vlan_name: net_type_5_vlan_name
  net_type_4_Vlan_name: net_type_4_vlan_name
  net_type_6_Vlan_name: net_type_6_vlan_name
  RD_ID: rd_id
  RD_#: rd_id
  VRF_name: vrf_name
  net_type_4_VRF_name: net_type_4_vrf_name
  FW_context_name: fw_context_name
  IP_local_pool_name: ip_local_pool_name
  IBVPN_metric: ibvpn_metric
  OSPF_area_#: ospf_area_num
  int_#:
    type: int_num
    scope: none
  password:
    type: any_token
    scope: none
  key_word:
    type: any_token
    scope: none
  int_name_A: int_name
  int_name_L: int_name
  Vrfglue_prefix_netmask:
    type: netmask_29
    role: netmask
  Inv_Vrfglue_prefix_netmask:
    type: wildcard_29
    role: netmask
  FWGLUE_Prefix_netmask:
    type: netmask_29
    role: netmask
  Inv_FWGLUE_Prefix_netmask:
    type: wildcard_29
    role: netmask
  Vpnglue_prefix_netmask:
    type: netmask_29
    role: netmask
  Inv_Vpnglue_prefix_netmask:
    type: wildcard_29
    role: netmask
  User_prefix:
    type: ipv4
    pool: user_ipv4
  User_prefix_netmask:
    type: ipv4
    role: netmask
  User_Prefix_last_IP:
    type: ipv4
    pool: user_ipv4
  IP_local_pool_first_IP:
    type: ipv4
    scope: none
  IP_local_pool_last_IP:
    type: ipv4
    scope: none
  IP_local_pool_prefix:
    type: ipv4
    scope: none
  IP_local_pool_netmask:
    type: ipv4
    scope: none
    role: netmask
  Vrfglue_prefix:
    type: ipv4
    pool: infra_ipv4
  Vrfglue_prefix_1st_IP:
    type: ipv4
    pool: infra_ipv4
  Vrfglue_prefix_last_IP:
    type: ipv4
    pool: infra_ipv4
  FWGLUE_Prefix:
    type: ipv4
    pool: infra_ipv4
  FWGLUE_Prefix_last_IP:
    type: ipv4
    pool: infra_ipv4
  FWGLUE_Prefix_1st_IP:
    type: ipv4
    pool: infra_ipv4
  Vpnglue_prefix:
    type: ipv4_host
    pool: infra_ipv4
  Vpnglue_prefix_1st_IP:
    type: ipv4_host
    pool: infra_ipv4
  Vpnglue_prefix_last_IP:
    type: ipv4_host
    pool: infra_ipv4
  GW-FW_outside_IP:
    type: ipv4
    scope: section
    pool: infra_ipv4
  GW-FW_inside_IP:
    type: ipv4
    pool: infra_ipv4
  GW-VRFGLUE_IP:
    type: ipv4
    pool: infra_ipv4
  IP_helper_address: ipv4_host
  mdt_default_address: mdt_address
  mdt_data_address: mdt_address
  test_int_#:
    type: test_int_num
    scope: none

# Subnet families. Membership is declared, replacing the union-find over
# shared name prefixes that previously recovered it at runtime.
groups:
  user_prefix:
    members:
      - User_Prefix_last_IP
      - User_prefix
      - User_prefix_netmask
  vrfglue_prefix:
    members:
      - Vrfglue_prefix
      - Vrfglue_prefix_1st_IP
      - Vrfglue_prefix_last_IP
      - Vrfglue_prefix_netmask
  fwglue_prefix:
    members:
      - FWGLUE_Prefix
      - FWGLUE_Prefix_1st_IP
      - FWGLUE_Prefix_last_IP
      - FWGLUE_Prefix_netmask
  vpnglue_prefix:
    members:
      - Vpnglue_prefix
      - Vpnglue_prefix_1st_IP
      - Vpnglue_prefix_last_IP
      - Vpnglue_prefix_netmask

# Ranges values must fall in. Optional: a variable with no `pool` is not
# range-checked. The values below are the wide defaults the engine used for
# integration testing, not a real network's allocations.
pools:
  infra_ipv4:
    kind: ipv4
    ip: '10.45.0.0'
    mask: '/16'
  user_ipv4:
    kind: ipv4
    ip: '10.45.0.0'
    mask: '/16'
  user_vlan:
    kind: int
    start: 1
    end: 4096
